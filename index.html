  return function IconComp({ size = 18, color, style, strokeWidth, ...rest }) {
    return (
      <span
        style={{ fontSize: size, lineHeight: 1, display: "inline-block", color, ...style }}
        {...rest}
      >
        {glyph}
      </span>
    );
  };
}

const traducirErrorAuth = (msg) => {
  if (msg === "confirm-email-required")
    return "Tu cuenta se creó, pero Supabase pide confirmar el email antes de continuar. Revisá tu correo, o desactivá \"Confirm email\" en Supabase → Authentication → Providers → Email para pruebas.";
  if (msg === "sin-permiso-admin")
    return "Esta cuenta no tiene permisos de administrador. En Supabase → Table Editor → perfiles, cambiá el rol de esta cuenta a 'admin'.";
  const m = (msg || "").toLowerCase();
  if (m.includes("already registered") || m.includes("already exists") || m.includes("duplicate"))
    return "Ese email ya está registrado. Probá iniciar sesión.";
  if (m.includes("invalid login") || m.includes("invalid_grant") || m.includes("invalid credentials"))
    return "Email o contraseña incorrectos.";
  if (m.includes("password") && (m.includes("6") || m.includes("short")))
    return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("email") && m.includes("invalid")) return "El email no es válido.";
  return msg || "Ocurrió un error. Probá de nuevo.";
};
