function makeIcon(glyph) {
  return function IconComp({ size = 18, color, style, strokeWidth, ...rest }) {
    return (
      <span
        style={{ fontSize: size, lineHeight: 1, display: "inline-block", color, ...style }}
        {...rest}
      >
        {glyph}
      </span>
    );
  };
}

const traducirErrorAuth = (msg) => {
  if (msg === "confirm-email-required")
    return "Tu cuenta se creó, pero Supabase pide confirmar el email antes de continuar. Revisá tu correo, o desactivá \"Confirm email\" en Supabase → Authentication → Providers → Email para pruebas.";
  if (msg === "sin-permiso-admin")
    return "Esta cuenta no tiene permisos de administrador. En Supabase → Table Editor → perfiles, cambiá el rol de esta cuenta a 'admin'.";
  const m = (msg || "").toLowerCase();
  if (m.includes("already registered") || m.includes("already exists") || m.includes("duplicate"))
    return "Ese email ya está registrado. Probá iniciar sesión.";
  if (m.includes("invalid login") || m.includes("invalid_grant") || m.includes("invalid credentials"))
    return "Email o contraseña incorrectos.";
  if (m.includes("password") && (m.includes("6") || m.includes("short")))
    return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("email") && m.includes("invalid")) return "El email no es válido.";
  return msg || "Ocurrió un error. Probá de nuevo.";
};

/* ---------------- Panel administrador (cuenta de UruCompra) ---------------- */
function AdminPanel({ goTo, session, cuenta, onLogin, onSave }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState("");
  const [loginLoading, setLoginLoading] = useState(false);

  const [tipo, setTipo] = useState(cuenta?.tipo || "cuenta");
  const [datos, setDatos] = useState({
    banco: cuenta?.banco || "",
    titular: cuenta?.titular || "",
    numero: cuenta?.numero || "",
  });
  const [error, setError] = useState("");
  const [guardado, setGuardado] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const setField = (k) => (e) => setDatos((d) => ({ ...d, [k]: e.target.value }));

  const entrar = async () => {
    if (!email.trim() || !password.trim()) {
      setLoginError("Completá email y contraseña.");
      return;
    }
    setLoginError("");
    setLoginLoading(true);
    try {
      await onLogin(email.trim(), password);
    } catch (err) {
      setLoginError(traducirErrorAuth(err.message));
    } finally {
      setLoginLoading(false);
    }
  };

  const guardar = async () => {
    if (!datos.titular.trim() || !datos.numero.trim() || (tipo === "cuenta" && !datos.banco.trim())) {
      setError("Completá los datos para poder cobrar las comisiones.");
      return;
    }
    setError("");
    setGuardando(true);
    try {
      await onSave({ tipo, ...datos });
      setGuardado(true);
      setTimeout(() => setGuardado(false), 2000);
    } catch (err) {
      setError(traducirErrorAuth(err.message));
    } finally {
      setGuardando(false);
    }
  };

  if (!session) {
    return (
      <div>
        <Header onBack={() => goTo("welcome")} title="Panel administrador" />
        <div style={{ padding: 20, display: "grid", gap: 18, maxWidth: 480 }}>
          <p style={{ fontSize: 13, color: "var(--ink-soft)" }}>
            Esta pantalla es solo para vos, como dueño de UruCompra. Iniciá sesión con la cuenta
            que tenga permisos de administrador.
          </p>
          <Field label="Email">
            <input
              type="email"
              style={inputStyle}
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="admin@urucompra.com"
            />
          </Field>
          <Field label="Contraseña">
            <input
              type="password"
              style={inputStyle}
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Tu contraseña"
            />

/* ---------------- Panel de comercio ---------------- */
function ComercioDashboard({
  comercio,
  goTo,
  onAddProducto,
  onDeleteProducto,
  onSaveCuentaCobro,
  onLiquidarDeuda,
  onLogout,
}) {
  const [tab, setTab] = useState("productos");
  const [form, setForm] = useState({
    nombre: "",
    precio: "",
    categoria: CATEGORIAS_PRODUCTO[0],
    stock: "",
    imagen: "",
  });
  const [error, setError] = useState("");
  const [guardando, setGuardando] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const submit = async (e) => {
    e.preventDefault();
    const precio = Number(form.precio);
    const stock = Number(form.stock) || 0;
    if (!form.nombre.trim() || !precio || precio <= 0) {
      setError("Poné un nombre y un precio válido.");
      return;
    }
    setError("");
    setGuardando(true);
    try {
      await onAddProducto({
        nombre: form.nombre,
        precio,
        categoria: form.categoria,
        stock,
        imagen: form.imagen.trim(),
      });
      setForm({ nombre: "", precio: "", categoria: CATEGORIAS_PRODUCTO[0], stock: "", imagen: "" });
    } catch (err) {
      setError(traducirErrorAuth(err.message));
    } finally {
      setGuardando(false);
    }
  };

  const pedidos = comercio.pedidos || [];
  const ventasElectronicas = pedidos.filter((p) => p.metodoPago !== "efectivo");
  const ventasEfectivo = pedidos.filter((p) => p.metodoPago === "efectivo");
  const deudaPendiente = ventasEfectivo
    .filter((p) => !p.liquidado)
    .reduce((s, p) => s + p.comision, 0);
  const totalElectronicoNeto = ventasElectronicas.reduce((s, p) => s + (p.subtotal - p.comision), 0);
  const totalEfectivoCobrado = ventasEfectivo.reduce((s, p) => s + p.subtotal, 0);

  const totalVentaEjemplo = comercio.productos.reduce((s, p) => s + p.precio, 0);

  return (
    <div>
      <Header
        onBack={() => goTo("welcome")}
        title={comercio.nombre}
        right={
          <button
            type="button"
            className="uc-btn"
            onClick={onLogout}
            style={{ background: "transparent", color: "var(--paper)", fontSize: 11, padding: 6 }}
          >
            Salir
          </button>
        }
      />

      <div style={{ padding: 20 }}>
        <div
          className="uc-tag"
          style={{ padding: "16px 16px 16px 26px", marginBottom: 18, transform: "rotate(-0.4deg)" }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div className="uc-display" style={{ fontSize: 12, color: "var(--ink-soft)", fontWeight: 700 }}>
                {comercio.categoria} · {comercio.tipoDoc}
              </div>
              <div className="uc-mono" style={{ fontSize: 13, marginTop: 2 }}>
                {comercio.documento}
              </div>
            </div>
            <div style={{ fontSize: 12.5, color: "var(--ink-soft)", display: "flex", alignItems: "center", gap: 6 }}>
              <MapPin size={14} /> {comercio.direccion}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {[
            { id: "productos", label: "Productos" },
            { id: "cobros", label: "Cobros" },
          ].map((t) => (
            <button
              key={t.id}
              type="button"
              className="uc-btn"
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                padding: "10px 0",
                borderRadius: 8,
                fontSize: 13.5,
                background: tab === t.id ? "var(--teal)" : "var(--paper)",
                color: tab === t.id ? "var(--paper)" : "var(--ink)",
                border: "1.5px solid var(--teal)",
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        {tab === "productos" ? (
          <ProductosTab
            comercio={comercio}
            form={form}
            set={set}
            error={error}
            submit={submit}
            guardando={guardando}
            onDeleteProducto={onDeleteProducto}
            totalVentaEjemplo={totalVentaEjemplo}
          />
        ) : (
          <CobrosTab
            comercio={comercio}
            deudaPendiente={deudaPendiente}
            totalElectronicoNeto={totalElectronicoNeto}
            totalEfectivoCobrado={totalEfectivoCobrado}
            pedidos={pedidos}
            onSaveCuentaCobro={onSaveCuentaCobro}
            onLiquidarDeuda={onLiquidarDeuda}
          />
        )}
      </div>
    </div>
  );
}

  comercio,

  set,
  error,
  submit,
  guardando,
  onDeleteProducto,
  totalVentaEjemplo,
}) {
  const [errorEliminar, setErrorEliminar] = useState("");

  const eliminar = async (id) => {
    setErrorEliminar("");
    try {
      await onDeleteProducto(id);
    } catch (err) {
      setErrorEliminar(traducirErrorAuth(err.message));
    }
  };

  return (
    <div>
      <div
        style={{
          background: "var(--teal)",
          color: "var(--paper)",
          borderRadius: 10,
          padding: "12px 16px",
          fontSize: 13,
          marginBottom: 24,
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
        }}
      >
        <span>Tu catálogo</span>
        <span className="uc-mono" style={{ color: "var(--mustard)" }}>

              style={inputStyle}

          <div style={{ gridColumn: "1 / -1" }}>

                <div
                  style={{
                    width: 46,
                    height: 46,
                    borderRadius: 8,
                    border: "1.5px solid var(--line)",
                    background: "var(--bg)",

                    overflow: "hidden",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",

                  {form.imagen ? (

                      src={form.imagen}
                      alt=""
                      style={{ width: "100%", height: "100%", objectFit: "cover" }}
                      onError={(e) => {
                        e.target.style.display = "none";
                      }}
                    />
                  ) : (
                    <ImageIcon size={18} color="var(--ink-soft)" />
                  )}
                </div>
                <input
                  style={{ ...inputStyle, flex: 1 }}
                  value={form.imagen}
                  onChange={set("imagen")}
                  placeholder="https://... (opcional)"
                />
              </div>
            </Field>
          </div>
          {error && (
            <div style={{ gridColumn: "1 / -1", color: "var(--brick)", fontSize: 13, fontWeight: 600 }}>
              {error}
            </div>
          )}
          <button
            className="uc-btn"
            type="button"
            disabled={guardando}
            onClick={submit}
            style={{
              gridColumn: "1 / -1",
              background: "var(--mustard)",
              color: "var(--teal-dark)",
              padding: "12px 0",
              borderRadius: 8,
              fontSize: 14.5,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              boxShadow: "0 3px 0 var(--mustard-dark)",
            }}
          >
            <Plus size={18} /> {guardando ? "Guardando…" : "Agregar producto"}
          </button>
        </div>

        {errorEliminar && (
          <div style={{ color: "var(--brick)", fontSize: 13, fontWeight: 600, marginBottom: 12 }}>
            {errorEliminar}
          </div>

        <div className="uc-display" style={{ fontSize: 20, fontWeight: 800, color: "var(--teal)", marginBottom: 12 }}>
          Mis productos
        </div>

        {comercio.productos.length === 0 ? (
          <EmptyState text="Todavía no cargaste productos. Sumá el primero arriba." />

          <div style={{ display: "grid", gap: 10 }}>

              <div
                key={p.id}
                className="uc-tag"
                style={{
                  padding: "12px 14px 12px 26px",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                  <ProductThumb src={p.imagen} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 600, fontSize: 14.5 }}>{p.nombre}</div>
                    <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>
                      {p.categoria} · stock {p.stock}
                    </div>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <div className="uc-mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--teal)" }}>
                    {money(p.precio)}
                  </div>
                  <button
                    className="uc-btn"
                    onClick={() => eliminar(p.id)}
                    aria-label={`Eliminar ${p.nombre}`}
                    style={{ background: "transparent", color: "var(--brick)", padding: 4 }}
                  >
                    <Trash2 size={17} />
                  </button>
                </div>
              </div>
            ))}

        )}

        {comercio.productos.length > 0 && (
          <div style={{ marginTop: 20, fontSize: 12.5, color: "var(--ink-soft)" }}>
            Si vendieras todo el catálogo hoy ({money(totalVentaEjemplo)}), tu ganancia neta
            estimada sería{" "}
            <b className="uc-mono">{money(Math.round(totalVentaEjemplo * (1 - COMISION)))}</b>{" "}
            después de la comisión.
          </div>
        )}
    </div>
  );
}

function ProductThumb({ src, size = 44 }) {
  const [failed, setFailed] = useState(false);
  return (
    <div
      style={{
        width: size,
        height: size,
        borderRadius: 8,
        border: "1.5px solid var(--line)",

        flexShrink: 0,

        alignItems: "center",

      }}

        <img
          src={src}

}

function CobrosTab({
  comercio,
  deudaPendiente,
  totalElectronicoNeto,
  totalEfectivoCobrado,
  pedidos,
  onSaveCuentaCobro,
  onLiquidarDeuda,
}) {
  const [editando, setEditando] = useState(!comercio.cuentaCobro);
  const [tipo, setTipo] = useState(comercio.cuentaCobro?.tipo || "cuenta");
  const [datos, setDatos] = useState({
    banco: comercio.cuentaCobro?.banco || "",
    titular: comercio.cuentaCobro?.titular || "",
    numero: comercio.cuentaCobro?.numero || "",
  });
  const [error, setError] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [liquidando, setLiquidando] = useState(false);
  const [errorLiquidar, setErrorLiquidar] = useState("");
  const setField = (k) => (e) => setDatos((d) => ({ ...d, [k]: e.target.value }));

  const guardar = async () => {
    if (!datos.titular.trim() || !datos.numero.trim() || (tipo === "cuenta" && !datos.banco.trim())) {
      setError("Completá los datos para poder cobrar.");
      return;
    }
    setError("");
    setGuardando(true);
    try {
      await onSaveCuentaCobro({ tipo, ...datos });
      setEditando(false);
    } catch (err) {
      setError(traducirErrorAuth(err.message));
    } finally {
      setGuardando(false);
    }
  };

  const liquidar = async () => {
    setErrorLiquidar("");
    setLiquidando(true);
    try {
      await onLiquidarDeuda();
    } catch (err) {
      setErrorLiquidar(traducirErrorAuth(err.message));
    } finally {
      setLiquidando(false);
    }
  };

  return (
    <div>
      {/* Cuenta para recibir pagos */}
      <div className="uc-display" style={{ fontSize: 20, fontWeight: 800, color: "var(--teal)", marginBottom: 12 }}>
        Cuenta para cobrar
      </div>

      {!editando && comercio.cuentaCobro ? (
        <div
          className="uc-tag"
          style={{
            padding: "14px 14px 14px 26px",
            marginBottom: 26,
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            gap: 10,
          }}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {comercio.cuentaCobro.tipo === "cuenta" ? (
              <Landmark size={20} color="var(--teal)" />
            ) : (
              <CreditCard size={20} color="var(--teal)" />
            )}
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>
                {comercio.cuentaCobro.tipo === "cuenta"
                  ? comercio.cuentaCobro.banco
                  : "Tarjeta para cobros"}
              </div>
              <div className="uc-mono" style={{ fontSize: 12, color: "var(--ink-soft)" }}>
                {comercio.cuentaCobro.titular} · termina en{" "}
                {comercio.cuentaCobro.numero.slice(-4)}
              </div>
            </div>
          </div>
          <button
            className="uc-btn"
            type="button"
            onClick={() => setEditando(true)}
            style={{ background: "transparent", color: "var(--teal)", fontSize: 12, padding: 4 }}
          >
            Editar
          </button>
        </div>
      ) : (
        <div
          style={{
            display: "grid",
            gap: 12,
            marginBottom: 26,
            background: "var(--paper)",
            border: "1.5px solid var(--line)",
            borderRadius: 12,
            padding: 16,
          }}
        >
          <div style={{ display: "flex", gap: 8 }}>
            {[
              { id: "cuenta", label: "Cuenta bancaria", icon: Landmark },
              { id: "tarjeta", label: "Tarjeta", icon: CreditCard },
            ].map((t) => (
              <button
                key={t.id}
                type="button"
                onClick={() => setTipo(t.id)}
                className="uc-btn"
                style={{
                  flex: 1,
                  padding: "9px 0",
                  borderRadius: 8,
                  fontSize: 12.5,
                  background: tipo === t.id ? "var(--teal)" : "var(--bg)",
                  color: tipo === t.id ? "var(--paper)" : "var(--ink)",
                  border: "1.5px solid var(--teal)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 6,
                }}
              >
                <t.icon size={15} /> {t.label}
              </button>
            ))}
          </div>

          {tipo === "cuenta" && (
            <Field label="Banco">
              <input style={inputStyle} value={datos.banco} onChange={setField("banco")} placeholder="Ej: BROU" />
            </Field>
          )}
          <Field label="Titular">
            <input
              style={inputStyle}
              value={datos.titular}
              onChange={setField("titular")}
              placeholder="Nombre como figura en la cuenta"
            />
          </Field>
          <Field label={tipo === "cuenta" ? "Número de cuenta" : "Número de tarjeta"}>
            <input
              className="uc-mono"
              style={inputStyle}
              value={datos.numero}
              onChange={setField("numero")}
              placeholder={tipo === "cuenta" ? "001234567890" : "•••• •••• •••• ••••"}
            />
          </Field>
          {error && (
            <div style={{ color: "var(--brick)", fontSize: 13, fontWeight: 600 }}>{error}</div>
          )}
          <button
            className="uc-btn"
            type="button"
            disabled={guardando}
            onClick={guardar}
            style={{
              background: "var(--mustard)",
              color: "var(--teal-dark)",
              padding: "11px 0",
              borderRadius: 8,
              fontSize: 14,
              boxShadow: "0 3px 0 var(--mustard-dark)",
            }}
          >
            {guardando ? "Guardando…" : "Guardar datos de cobro"}
          </button>
          <div style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>
            Acá vas a recibir el neto de tus ventas con tarjeta o transferencia, y desde acá se
            descuenta la comisión de las ventas en efectivo.
          </div>
        </div>
      )}

      {/* Resumen de cobros */}
      <div className="uc-display" style={{ fontSize: 20, fontWeight: 800, color: "var(--teal)", marginBottom: 12 }}>
        Resumen
      </div>

      <div style={{ display: "grid", gap: 10, marginBottom: 22 }}>
        <div
          style={{
            background: "var(--paper)",
            border: "1.5px solid var(--line)",
            borderRadius: 10,
            padding: 14,
          }}
        >
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>
            Cobrado por tarjeta/transferencia (ya neto de comisión)
          </div>
          <div className="uc-mono" style={{ fontSize: 20, fontWeight: 700, color: "var(--teal)" }}>
            {money(totalElectronicoNeto)}
          </div>
        </div>

        <div
          style={{
            background: "var(--paper)",
            border: "1.5px solid var(--line)",
            borderRadius: 10,
            padding: 14,
          }}
        >
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>
            Cobrado en efectivo directamente por vos
          </div>
          <div className="uc-mono" style={{ fontSize: 20, fontWeight: 700 }}>
            {money(totalEfectivoCobrado)}
          </div>
        </div>

        <div
          style={{
            background: deudaPendiente > 0 ? "var(--brick)" : "var(--paper)",
            border: `1.5px solid ${deudaPendiente > 0 ? "var(--brick)" : "var(--line)"}`,
            color: deudaPendiente > 0 ? "var(--paper)" : "var(--ink)",
            borderRadius: 10,
            padding: 14,
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            gap: 10,
            flexWrap: "wrap",
          }}
        >
          <div>
            <div style={{ fontSize: 12.5, opacity: 0.9 }}>
              Comisión pendiente por ventas en efectivo
            </div>
            <div className="uc-mono" style={{ fontSize: 20, fontWeight: 700 }}>
              {money(deudaPendiente)}
            </div>
            {errorLiquidar && (
              <div style={{ fontSize: 11.5, fontWeight: 600, marginTop: 6 }}>{errorLiquidar}</div>
            )}
          </div>
          {deudaPendiente > 0 && (
            <button
              className="uc-btn"
              type="button"
              disabled={!comercio.cuentaCobro || liquidando}
              onClick={liquidar}
              style={{
                background: "var(--mustard)",
                color: "var(--teal-dark)",
                padding: "10px 16px",
                borderRadius: 8,
                fontSize: 12.5,
                boxShadow: "0 3px 0 var(--mustard-dark)",
              }}
            >
              {!comercio.cuentaCobro
                ? "Cargá una cuenta para liquidar"
                : liquidando
                ? "Liquidando…"
                : "Liquidar deuda"}
            </button>
          )}
        </div>
      </div>

      {/* Pedidos recibidos */}
      <div className="uc-display" style={{ fontSize: 20, fontWeight: 800, color: "var(--teal)", marginBottom: 12 }}>
        Pedidos recibidos
      </div>
      {pedidos.length === 0 ? (
        <EmptyState text="Todavía no te llegó ningún pedido." />
      ) : (
        <div style={{ display: "grid", gap: 8 }}>
          {[...pedidos]
            .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
            .map((p) => (
              <div
                key={p.id}
                style={{
                  background: "var(--paper)",
                  border: "1.5px solid var(--line)",
                  borderRadius: 10,
                  padding: 12,
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5 }}>{p.clienteNombre}</div>
                  <div className="uc-mono" style={{ fontSize: 13.5, fontWeight: 700 }}>
                    {money(p.subtotal)}
                  </div>
                </div>
                <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>
                  {p.items.map((i) => `${i.cantidad}× ${i.nombre}`).join(", ")}
                </div>
                <div
                  style={{
                    marginTop: 6,
                    display: "flex",
                    gap: 8,
                    alignItems: "center",
                    fontSize: 11,
                  }}
                >
                  <span
                    className="uc-mono"
                    style={{
                      background: "var(--bg)",
                      borderRadius: 20,
                      padding: "2px 9px",
                      color: "var(--ink-soft)",
                    }}
                  >
                    {METODOS_PAGO.find((m) => m.id === p.metodoPago)?.label || p.metodoPago}
                  </span>
                  {p.metodoPago === "efectivo" && (
                    <span
                      className="uc-mono"
                      style={{
                        color: p.liquidado ? "var(--teal)" : "var(--brick)",
                        fontWeight: 600,
                      }}
                    >
                      {p.liquidado ? "Comisión liquidada" : `Comisión pendiente: ${money(p.comision)}`}
                    </span>
                  )}
                </div>
              </div>
            ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Mercado (cliente) ---------------- */
function ClienteMarket({ comercios, cliente, cart, goTo, onAddToCart, cartCount, onLogout }) {
  const [selected, setSelected] = useState(null);
  const [query, setQuery] = useState("");

  const filtered = comercios.filter((c) =>
    (c.nombre + c.categoria).toLowerCase().includes(query.toLowerCase())
  );

  if (selected) {
    return (
      <ComercioStore
        comercio={selected}
        onBack={() => setSelected(null)}
        onAddToCart={onAddToCart}
        goTo={goTo}
        cartCount={cartCount}
      />
    );
  }

  return (
    <div>
      <Header
        title="Comercios cerca tuyo"
        right={
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <CartButton count={cartCount} onClick={() => goTo("cart")} />
            <button
              type="button"
              className="uc-btn"
              onClick={onLogout}
              style={{ background: "transparent", color: "var(--paper)", fontSize: 11, padding: 6 }}
            >
              Salir
            </button>
          </div>
        }
      />
      <div style={{ padding: 20 }}>
        <div style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 14 }}>
          Entregando en <b>{cliente?.direccion || "tu dirección"}</b>
        </div>

        <div style={{ position: "relative", marginBottom: 18 }}>
          <Search
            size={17}
            style={{ position: "absolute", left: 12, top: 13, color: "var(--ink-soft)" }}
          />
          <input
            style={{ ...inputStyle, paddingLeft: 38 }}
            placeholder="Buscar almacén, mercadito..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>

        {filtered.length === 0 ? (
          <EmptyState text="No hay comercios que coincidan con la búsqueda." />
        ) : (
          <div style={{ display: "grid", gap: 12 }}>
            {filtered.map((c) => (
              <button
                key={c.id}
                onClick={() => setSelected(c)}
                className="uc-btn uc-card"
                style={{
                  textAlign: "left",
                  background: "var(--paper)",
                  border: "1.5px solid var(--line)",
                  borderRadius: 12,
                  padding: 16,
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15.5 }}>{c.nombre}</div>
                  <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 3 }}>
                    {c.categoria} · {c.productos.length} productos
                  </div>
                  <div
                    style={{
                      fontSize: 11.5,
                      color: "var(--ink-soft)",
                      marginTop: 3,
                      display: "flex",
                      alignItems: "center",
                      gap: 4,
                    }}
                  >
                    <MapPin size={12} /> {c.direccion}
                  </div>
                </div>
                <span
                  className="uc-display"
                  style={{
                    background: "var(--mustard)",
                    color: "var(--teal-dark)",
                    padding: "6px 12px",
                    borderRadius: 20,
                    fontSize: 12,
                    fontWeight: 800,
                  }}
                >
                  Ver
                </span>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

        right={<CartButton count={cartCount} onClick={() => goTo("cart")} />}

        </div>
        <div style={{ display: "grid", gap: 10 }}>
          {comercio.productos.map((p) => (
            <div
              key={p.id}
              className="uc-tag"
              style={{
                padding: "12px 14px 12px 26px",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                gap: 10,
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                <ProductThumb src={p.imagen} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5 }}>{p.nombre}</div>
                  <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>{p.categoria}</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div className="uc-mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--teal)" }}>
                  {money(p.precio)}
                </div>
                <button
                  className="uc-btn"
                  onClick={() => onAddToCart(comercio, p)}
                  style={{
                    background: "var(--teal)",

                    borderRadius: 7,
                    padding: "7px 10px",
                    display: "flex",

                    gap: 4,

}

/* ---------------- Carrito / checkout ---------------- */
const METODOS_PAGO = [
  { id: "tarjeta", label: "Tarjeta", desc: "Débito o crédito", icon: CreditCard },
  { id: "efectivo", label: "Efectivo", desc: "Pagás al recibir", icon: Banknote },
  { id: "transferencia", label: "Transferencia", desc: "Antes de la entrega", icon: Landmark },
];

function Cart({ cart, goTo, onChangeQty, onRemove, onConfirm, confirmed, lastPaymentMethod }) {
  const [metodoPago, setMetodoPago] = useState(null);
  const [tarjeta, setTarjeta] = useState({ numero: "", vencimiento: "", cvv: "" });
  const [error, setError] = useState("");
  const [confirmando, setConfirmando] = useState(false);

  const grouped = cart.reduce((acc, item) => {
    (acc[item.comercioNombre] = acc[item.comercioNombre] || []).push(item);
    return acc;
  }, {});

  const subtotal = cart.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const total = subtotal;

  const setTarjetaField = (k) => (e) => setTarjeta((t) => ({ ...t, [k]: e.target.value }));

  const confirmar = async () => {
    if (!metodoPago) {
      setError("Elegí un método de pago para continuar.");
      return;
    }
    if (metodoPago === "tarjeta") {
      if (!tarjeta.numero.trim() || !tarjeta.vencimiento.trim() || !tarjeta.cvv.trim()) {
        setError("Completá los datos de la tarjeta.");
        return;
      }
    }
    setError("");
    setConfirmando(true);
    try {
      await onConfirm(metodoPago);
    } catch (err) {
      setError(traducirErrorAuth(err.message));
    } finally {
      setConfirmando(false);
    }
  };

  if (confirmed) {
    return (
      <div>
        <Header title="Pedido confirmado" />
        <div style={{ padding: 40, textAlign: "center" }}>
          <div
            style={{
              width: 64,
              height: 64,
              borderRadius: "50%",
              background: "var(--teal)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              margin: "0 auto 18px",
            }}
          >
            <Check size={32} color="var(--mustard)" />
          </div>
          <div className="uc-display" style={{ fontSize: 24, fontWeight: 800, color: "var(--teal)" }}>
            ¡Pedido en camino!
          </div>
          <p style={{ color: "var(--ink-soft)", fontSize: 14, marginTop: 8 }}>
            Los comercios ya recibieron tu pedido y coordinan el delivery.
          </p>
          {lastPaymentMethod && (
            <div
              className="uc-mono"
              style={{
                marginTop: 14,
                display: "inline-flex",
                alignItems: "center",
                gap: 6,
                background: "var(--paper)",
                border: "1.5px solid var(--line)",
                borderRadius: 20,
                padding: "6px 14px",
                fontSize: 12.5,
                color: "var(--ink-soft)",
              }}
            >
              Pago: {METODOS_PAGO.find((m) => m.id === lastPaymentMethod)?.label}
            </div>
          )}
          <button
            className="uc-btn"
            onClick={() => goTo("cliente-market")}
            style={{
              marginTop: 24,
              background: "var(--mustard)",
              color: "var(--teal-dark)",
              padding: "12px 24px",
              borderRadius: 10,
              boxShadow: "0 3px 0 var(--mustard-dark)",
            }}
          >
            Seguir comprando
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Header onBack={() => goTo("cliente-market")} title="Tu carrito" />
      <div style={{ padding: 20 }}>
        {cart.length === 0 ? (
          <EmptyState text="Tu carrito está vacío. Volvé al mercado para agregar productos." />
        ) : (
          <>
            {Object.entries(grouped).map(([nombreComercio, items]) => (
              <div key={nombreComercio} style={{ marginBottom: 22 }}>
                <div
                  className="uc-display"
                  style={{ fontSize: 14, fontWeight: 800, color: "var(--teal)", marginBottom: 8 }}
                >
                  {nombreComercio}
                </div>
                <div style={{ display: "grid", gap: 8 }}>
                  {items.map((item) => (
                    <div
                      key={item.id}
                      style={{
                        background: "var(--paper)",
                        border: "1.5px solid var(--line)",
                        borderRadius: 10,
                        padding: 12,
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "center",
                        gap: 8,
                      }}
                    >
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontWeight: 600, fontSize: 14 }}>{item.nombre}</div>
                        <div className="uc-mono" style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>
                          {money(item.precio)} c/u
                        </div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <button
                          className="uc-btn"
                          onClick={() => onChangeQty(item.id, -1)}
                          aria-label="Restar"
                          style={{ background: "var(--bg)", padding: 6, borderRadius: 6 }}
                        >
                          <Minus size={14} />
                        </button>
                        <span className="uc-mono" style={{ minWidth: 18, textAlign: "center" }}>
                          {item.cantidad}
                        </span>
                        <button
                          className="uc-btn"
                          onClick={() => onChangeQty(item.id, 1)}
                          aria-label="Sumar"
                          style={{ background: "var(--bg)", padding: 6, borderRadius: 6 }}
                        >
                          <Plus size={14} />
                        </button>
                        <button
                          className="uc-btn"
                          onClick={() => onRemove(item.id)}
                          aria-label={`Quitar ${item.nombre}`}
                          style={{ background: "transparent", color: "var(--brick)", padding: 4 }}
                        >
                          <X size={16} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}

            <div
              className="uc-display"
              style={{ fontSize: 14, fontWeight: 800, color: "var(--teal)", marginBottom: 8, marginTop: 6 }}
            >
              Método de pago
            </div>
            <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
              {METODOS_PAGO.map((m) => {
                const Icon = m.icon;
                const activo = metodoPago === m.id;
                return (
                  <button
                    key={m.id}
                    type="button"
                    className="uc-btn"
                    onClick={() => {
                      setMetodoPago(m.id);
                      setError("");
                    }}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 12,
                      padding: "12px 14px",
                      borderRadius: 10,
                      textAlign: "left",
                      background: activo ? "var(--teal)" : "var(--paper)",
                      color: activo ? "var(--paper)" : "var(--ink)",
                      border: `1.5px solid ${activo ? "var(--teal)" : "var(--line)"}`,
                    }}
                  >
                    <Icon size={20} />
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>{m.label}</div>
                      <div
                        style={{
                          fontSize: 11.5,
                          fontWeight: 500,
                          opacity: 0.8,
                        }}
                      >
                        {m.desc}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>

            {metodoPago === "tarjeta" && (
              <div
                style={{
                  display: "grid",
                  gap: 10,
                  marginBottom: 18,
                  background: "var(--paper)",
                  border: "1.5px solid var(--line)",
                  borderRadius: 10,
                  padding: 14,
                }}
              >
                <Field label="Número de tarjeta">
                  <input
                    className="uc-mono"
                    style={inputStyle}
                    value={tarjeta.numero}
                    onChange={setTarjetaField("numero")}
                    placeholder="•••• •••• •••• ••••"
                    maxLength={19}
                  />
                </Field>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <Field label="Vencimiento">
                    <input
                      className="uc-mono"
                      style={inputStyle}
                      value={tarjeta.vencimiento}
                      onChange={setTarjetaField("vencimiento")}
                      placeholder="MM/AA"
                      maxLength={5}
                    />
                  </Field>
                  <Field label="CVV">
                    <input
                      className="uc-mono"
                      style={inputStyle}
                      value={tarjeta.cvv}
                      onChange={setTarjetaField("cvv")}
                      placeholder="123"
                      maxLength={4}
                    />
                  </Field>
                </div>
              </div>
            )}

            {metodoPago === "transferencia" && (
              <div
                style={{
                  marginBottom: 18,
                  fontSize: 12.5,
                  color: "var(--ink-soft)",
                  background: "var(--paper)",
                  border: "1.5px dashed var(--line)",
                  borderRadius: 10,
                  padding: 12,
                }}
              >
                Te vamos a mostrar los datos bancarios del comercio al confirmar. El pedido se
                despacha una vez que el comercio confirma la transferencia.
              </div>
            )}

            {error && (
              <div style={{ color: "var(--brick)", fontSize: 13, fontWeight: 600, marginBottom: 12 }}>
                {error}
              </div>
            )}

            <div
              className="uc-tag"
              style={{ padding: "16px 16px 0 26px", marginTop: 10, overflow: "hidden" }}
            >
              <div style={{ display: "grid", gap: 8, fontSize: 13.5, paddingBottom: 16 }}>
                <Row label="Total a pagar" value={money(total)} bold />
              </div>
            </div>
            <div className="uc-perf" />

            <button
              className="uc-btn"
              type="button"
              disabled={confirmando}
              onClick={confirmar}
              style={{
                width: "100%",
                marginTop: 20,
                background: "var(--teal)",
                color: "var(--paper)",
                padding: "15px 0",
                borderRadius: 10,
                fontSize: 16,
                boxShadow: "0 3px 0 var(--teal-dark)",
              }}
            >
              {confirmando ? "Confirmando…" : `Confirmar pedido — ${money(total)}`}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function Row({ label, value, bold, muted }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between" }}>
      <span style={{ color: muted ? "var(--ink-soft)" : "var(--ink)", fontWeight: bold ? 800 : 500 }}>
        {label}
      </span>
      <span className="uc-mono" style={{ fontWeight: bold ? 800 : 600, fontSize: bold ? 16 : 13.5 }}>
        {value}
      </span>
    </div>
  );
}

/* ---------------- App raíz ---------------- */
/* ---------------- Mapeos entre la base de datos y la app ---------------- */
function mapComercioRow(row) {
  return {
    id: row.id,
    nombre: row.nombre,
    categoria: row.categoria,
    direccion: row.direccion,
    telefono: row.telefono,
    tipoDoc: row.tipo_doc,
    documento: row.documento,
    cuentaCobro: row.cuenta_cobro_tipo
      ? {
          tipo: row.cuenta_cobro_tipo,
          banco: row.cuenta_cobro_banco,
          titular: row.cuenta_cobro_titular,
          numero: row.cuenta_cobro_numero,
        }
      : null,
    productos: [],
    pedidos: [],
  };
}

function mapProductoRow(row) {
  return {
    id: row.id,
    nombre: row.nombre,
    precio: row.precio,
    categoria: row.categoria,
    stock: row.stock,
    imagen: row.imagen_url || "",
  };
}

function mapPedidoRow(row) {
  return {
    id: row.id,
    fecha: row.creado_en,
    items: (row.pedido_items || []).map((i) => ({
      nombre: i.producto_nombre,
      precio: i.precio,
      cantidad: i.cantidad,
    })),
    subtotal: row.subtotal,
    comision: row.comision,
    metodoPago: row.metodo_pago,
    clienteNombre: row.clientes?.perfiles?.nombre || "Cliente",
    liquidado: row.liquidado,
  };
}

function throwIfError(error) {
  if (error) throw new Error(error.message);
}

function App() {
  const [screen, setScreen] = useState("welcome");
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");

  const [comercios, setComercios] = useState([]);
  const [cuentaPlataforma, setCuentaPlataforma] = useState(null);

  const [clienteSession, setClienteSession] = useState(null);
  const [cliente, setCliente] = useState(null);
  const [cart, setCart] = useState([]);
  const [confirmed, setConfirmed] = useState(false);
  const [lastPaymentMethod, setLastPaymentMethod] = useState(null);

  const [comercioSession, setComercioSession] = useState(null);
  const [activeComercio, setActiveComercio] = useState(null);

  const [adminSession, setAdminSession] = useState(null);

  // Carga inicial: catálogo público + sesiones ya guardadas en este navegador
  useEffect(() => {
    (async () => {
      try {
        const [{ data: comerciosPublicos, error: e1 }, { data: productosActivos, error: e2 }, { data: configRows, error: e3 }] =
          await Promise.all([
            sbPublico.from("comercios_publico").select("*"),
            sbPublico.from("productos").select("*").eq("activo", true),
            sbPublico.from("configuracion").select("*"),
          ]);
        throwIfError(e1);
        throwIfError(e2);
        throwIfError(e3);

        const merged = (comerciosPublicos || []).map((c) => ({
          ...mapComercioRow(c),
          productos: (productosActivos || [])
            .filter((p) => p.comercio_id === c.id)
            .map(mapProductoRow),
        }));
        setComercios(merged);

        const cfg = configRows?.[0];
        if (cfg?.cuenta_tipo) {
          setCuentaPlataforma({
            tipo: cfg.cuenta_tipo,
            banco: cfg.cuenta_banco,
            titular: cfg.cuenta_titular,
            numero: cfg.cuenta_numero,
          });
        }

        // Restaurar sesión de cliente si ya había una guardada
        const { data: sesCliente } = await sbCliente.auth.getSession();
        if (sesCliente?.session) {
          const userId = sesCliente.session.user.id;
          const { data: rows } = await sbCliente
            .from("clientes")
            .select("*,perfiles(nombre,telefono)")
            .eq("id", userId);
          if (rows?.length) {
            setClienteSession({ userId });
            setCliente({ id: userId, nombre: rows[0].perfiles?.nombre || "Cliente", direccion: rows[0].direccion });
          }
        }

        // Restaurar sesión de comercio si ya había una guardada
        const { data: sesComercio } = await sbComercio.auth.getSession();
        if (sesComercio?.session) {
          const userId = sesComercio.session.user.id;
          const { data: rows } = await sbComercio.from("comercios").select("*").eq("id", userId);
          if (rows?.length) {
            const [productos, pedidosRes] = await Promise.all([
              sbComercio.from("productos").select("*").eq("comercio_id", userId),
              sbComercio
                .from("pedidos")
                .select("*,pedido_items(*),clientes(perfiles(nombre))")
                .eq("comercio_id", userId)
                .order("creado_en", { ascending: false }),
            ]);
            setComercioSession({ userId });
            setActiveComercio({
              ...mapComercioRow(rows[0]),
              productos: (productos.data || []).map(mapProductoRow),
              pedidos: (pedidosRes.data || []).map(mapPedidoRow),
            });
          }
        }

        // Restaurar sesión de administrador si ya había una guardada
        const { data: sesAdmin } = await sbAdmin.auth.getSession();
        if (sesAdmin?.session) {
          setAdminSession({ userId: sesAdmin.session.user.id });
        }
      } catch (err) {
        setLoadError(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const goTo = (s) => setScreen(s);

  const handleLogoutCliente = async () => {
    await sbCliente.auth.signOut();
    setClienteSession(null);
    setCliente(null);
    setCart([]);
    setScreen("welcome");
  };

  const handleLogoutComercio = async () => {
    await sbComercio.auth.signOut();
    setComercioSession(null);
    setActiveComercio(null);
    setScreen("welcome");
  };

  // ---- Comercio: registro, login, productos, cobros ----

  const handleCreateComercio = async (data) => {
    const { data: authData, error } = await sbComercio.auth.signUp({
      email: data.email,
      password: data.password,
    });
    throwIfError(error);
    if (!authData.session) throw new Error("confirm-email-required");
    const userId = authData.user.id;

    let { error: e1 } = await sbComercio
      .from("perfiles")
      .insert([{ id: userId, rol: "comercio", nombre: data.nombre, telefono: data.telefono || null }]);
    throwIfError(e1);

    const { data: rows, error: e2 } = await sbComercio
      .from("comercios")
      .insert([
        {
          id: userId,
          nombre: data.nombre,
          categoria: data.categoria,
          direccion: data.direccion,
          telefono: data.telefono || null,
          tipo_doc: data.tipoDoc,
          documento: data.documento,
        },
      ])
      .select();
    throwIfError(e2);

    setComercioSession({ userId });
    setActiveComercio(mapComercioRow(rows[0]));
    setScreen("comercio-dashboard");
  };

  const handleLoginComercio = async (email, password) => {
    const { data: authData, error } = await sbComercio.auth.signInWithPassword({ email, password });
    throwIfError(error);
    const userId = authData.user.id;
    const { data: rows, error: e1 } = await sbComercio.from("comercios").select("*").eq("id", userId);
    throwIfError(e1);
    if (!rows.length) throw new Error("Esta cuenta no tiene un comercio registrado.");

    const [productosRes, pedidosRes] = await Promise.all([
      sbComercio.from("productos").select("*").eq("comercio_id", userId),
      sbComercio
        .from("pedidos")
        .select("*,pedido_items(*),clientes(perfiles(nombre))")
        .eq("comercio_id", userId)
        .order("creado_en", { ascending: false }),
    ]);
    throwIfError(productosRes.error);
    throwIfError(pedidosRes.error);

    setComercioSession({ userId });
    setActiveComercio({
      ...mapComercioRow(rows[0]),
      productos: (productosRes.data || []).map(mapProductoRow),
      pedidos: (pedidosRes.data || []).map(mapPedidoRow),
    });
    setScreen("comercio-dashboard");
  };

  const handleAddProducto = async (producto) => {
    const { data: rows, error } = await sbComercio
      .from("productos")
      .insert([
        {
          comercio_id: comercioSession.userId,
          nombre: producto.nombre,
          precio: producto.precio,
          categoria: producto.categoria,
          stock: producto.stock,
          imagen_url: producto.imagen || null,
        },
      ])
      .select();
    throwIfError(error);
    const mapped = mapProductoRow(rows[0]);
    setActiveComercio((c) => ({ ...c, productos: [...c.productos, mapped] }));
    setComercios((prev) =>
      prev.map((c) =>
        c.id === comercioSession.userId ? { ...c, productos: [...c.productos, mapped] } : c
      )
    );
  };

  const handleDeleteProducto = async (productoId) => {
    const { error } = await sbComercio.from("productos").delete().eq("id", productoId);
    throwIfError(error);
    setActiveComercio((c) => ({ ...c, productos: c.productos.filter((p) => p.id !== productoId) }));
    setComercios((prev) =>
      prev.map((c) =>
        c.id === comercioSession.userId
          ? { ...c, productos: c.productos.filter((p) => p.id !== productoId) }
          : c
      )
    );
  };

  const handleSaveCuentaCobro = async (cuentaCobro) => {
    const { error } = await sbComercio
      .from("comercios")
      .update({
        cuenta_cobro_tipo: cuentaCobro.tipo,
        cuenta_cobro_banco: cuentaCobro.banco || null,
        cuenta_cobro_titular: cuentaCobro.titular,
        cuenta_cobro_numero: cuentaCobro.numero,
      })
      .eq("id", comercioSession.userId);
    throwIfError(error);
    setActiveComercio((c) => ({ ...c, cuentaCobro }));
  };

  const handleLiquidarDeuda = async () => {
    const { error } = await sbComercio
      .from("pedidos")
      .update({ liquidado: true })
      .eq("comercio_id", comercioSession.userId)
      .eq("metodo_pago", "efectivo")
      .eq("liquidado", false);
    throwIfError(error);
    setActiveComercio((c) => ({ ...c, pedidos: c.pedidos.map((p) => ({ ...p, liquidado: true })) }));
  };

  // ---- Cliente: registro, login, carrito, checkout ----

  const handleCreateCliente = async (data) => {
    const { data: authData, error } = await sbCliente.auth.signUp({
      email: data.email,
      password: data.password,
    });
    throwIfError(error);
    if (!authData.session) throw new Error("confirm-email-required");
    const userId = authData.user.id;

    let { error: e1 } = await sbCliente
      .from("perfiles")
      .insert([{ id: userId, rol: "cliente", nombre: data.nombre, telefono: data.telefono || null }]);
    throwIfError(e1);

    const { error: e2 } = await sbCliente.from("clientes").insert([{ id: userId, direccion: data.direccion }]);
    throwIfError(e2);

    setClienteSession({ userId });
    setCliente({ id: userId, nombre: data.nombre, direccion: data.direccion });
    setScreen("cliente-market");
  };

  const handleLoginCliente = async (email, password) => {
    const { data: authData, error } = await sbCliente.auth.signInWithPassword({ email, password });
    throwIfError(error);
    const userId = authData.user.id;
    const { data: rows, error: e1 } = await sbCliente
      .from("clientes")
      .select("*,perfiles(nombre,telefono)")
      .eq("id", userId);
    throwIfError(e1);
    if (!rows.length) throw new Error("Esta cuenta no tiene un perfil de cliente.");
    setClienteSession({ userId });
    setCliente({ id: userId, nombre: rows[0].perfiles?.nombre || "Cliente", direccion: rows[0].direccion });
    setScreen("cliente-market");
  };

  const handleAddToCart = (comercio, producto) => {
    setCart((prev) => {
      const idKey = `${comercio.id}-${producto.id}`;
      const existing = prev.find((i) => i.id === idKey);
      if (existing) {
        return prev.map((i) => (i.id === idKey ? { ...i, cantidad: i.cantidad + 1 } : i));
      }
      return [
        ...prev,
        {
          id: idKey,
          comercioId: comercio.id,
          comercioNombre: comercio.nombre,
          productoId: producto.id,
          nombre: producto.nombre,
          precio: producto.precio,
          cantidad: 1,
        },
      ];
    });
  };

  const handleChangeQty = (itemId, delta) => {
    setCart((prev) =>
      prev.map((i) => (i.id === itemId ? { ...i, cantidad: i.cantidad + delta } : i)).filter((i) => i.cantidad > 0)
    );
  };

  const handleRemove = (itemId) => setCart((prev) => prev.filter((i) => i.id !== itemId));

  const handleConfirm = async (metodoPago) => {
    const porComercio = cart.reduce((acc, item) => {
      (acc[item.comercioId] = acc[item.comercioId] || []).push(item);
      return acc;
    }, {});

    for (const comercioId of Object.keys(porComercio)) {
      const items = porComercio[comercioId];
      const subtotal = items.reduce((s, i) => s + i.precio * i.cantidad, 0);
      const comision = Math.round(subtotal * COMISION);
      const { data: pedidoRows, error: e1 } = await sbCliente
        .from("pedidos")
        .insert([
          {
            cliente_id: clienteSession.userId,
            comercio_id: comercioId,
            subtotal,
            comision,
            metodo_pago: metodoPago,
            liquidado: metodoPago !== "efectivo",
          },
        ])
        .select();
      throwIfError(e1);
      const { error: e2 } = await sbCliente.from("pedido_items").insert(
        items.map((i) => ({
          pedido_id: pedidoRows[0].id,
          producto_nombre: i.nombre,
          precio: i.precio,
          cantidad: i.cantidad,
        }))
      );
      throwIfError(e2);
    }

    setLastPaymentMethod(metodoPago);
    setConfirmed(true);
    setCart([]);
  };

  // ---- Administrador (cuenta de UruCompra) ----

  const handleLoginAdmin = async (email, password) => {
    const { data: authData, error } = await sbAdmin.auth.signInWithPassword({ email, password });
    throwIfError(error);
    setAdminSession({ userId: authData.user.id });
  };

  const handleSaveCuentaPlataforma = async (cuenta) => {
    const { data: rows, error } = await sbAdmin
      .from("configuracion")
      .update({
        cuenta_tipo: cuenta.tipo,
        cuenta_banco: cuenta.banco || null,
        cuenta_titular: cuenta.titular,
        cuenta_numero: cuenta.numero,
      })
      .eq("id", true)
      .select();
    throwIfError(error);
    if (!rows.length) throw new Error("sin-permiso-admin");
    setCuentaPlataforma(cuenta);
  };

  const cartCount = cart.reduce((s, i) => s + i.cantidad, 0);

  let body = null;
  if (loading) {
    body = <div style={{ padding: 60, textAlign: "center", color: "var(--ink-soft)" }}>Cargando…</div>;
  } else if (loadError) {
    body = (
      <div style={{ padding: 30 }}>
        <div style={{ background: "var(--brick)", color: "var(--paper)", borderRadius: 10, padding: 16, fontSize: 13.5 }}>
          No pudimos conectar con la base de datos. Detalle: {loadError}
        </div>
      </div>
    );
  } else if (screen === "welcome") {
    body = <Welcome goTo={goTo} cliente={cliente} activeComercio={activeComercio} />;
  } else if (screen === "terminos") {
    body = <Terminos goTo={goTo} />;
  } else if (screen === "admin") {
    body = (
      <AdminPanel goTo={goTo} session={adminSession} cuenta={cuentaPlataforma} onLogin={handleLoginAdmin} onSave={handleSaveCuentaPlataforma} />
    );
  } else if (screen === "register-comercio") {
    body = <RegisterComercio goTo={goTo} onCreateComercio={handleCreateComercio} />;
  } else if (screen === "login-comercio") {
    body = <Login goTo={goTo} rol="comercio" onLogin={handleLoginComercio} />;
  } else if (screen === "register-cliente") {
    body = <RegisterCliente goTo={goTo} onCreateCliente={handleCreateCliente} />;
  } else if (screen === "login-cliente") {
    body = <Login goTo={goTo} rol="cliente" onLogin={handleLoginCliente} />;
  } else if (screen === "comercio-dashboard" && activeComercio) {
    body = (
      <ComercioDashboard
        comercio={activeComercio}
        goTo={goTo}
        onAddProducto={handleAddProducto}
        onDeleteProducto={handleDeleteProducto}
        onSaveCuentaCobro={handleSaveCuentaCobro}
        onLiquidarDeuda={handleLiquidarDeuda}
        onLogout={handleLogoutComercio}
      />
    );
  } else if (screen === "cliente-market") {
    body = (
      <ClienteMarket
        comercios={comercios || []}
        cliente={cliente}
        cart={cart}
        cartCount={cartCount}
        goTo={goTo}
        onAddToCart={handleAddToCart}
        onLogout={handleLogoutCliente}
      />
    );
  } else if (screen === "cart") {
    body = (
      <Cart
        cart={cart}
        goTo={(s) => {
          setConfirmed(false);
          goTo(s);
        }}
        onChangeQty={handleChangeQty}
        onRemove={handleRemove}
        onConfirm={handleConfirm}
        confirmed={confirmed}
        lastPaymentMethod={lastPaymentMethod}
      />
    );
  } else {
    body = <Welcome goTo={goTo} cliente={cliente} activeComercio={activeComercio} />;
  }

  return (
    <div className="uc-root" style={{ maxWidth: 480, margin: "0 auto", boxShadow: "0 0 0 1px var(--line)" }}>
      <GlobalStyle />
      {body}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
